server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Скрываем версию nginx в ответах и в заголовках ошибок
    server_tokens off;

    # Ограничение размера тела запроса на уровне прокси (полезные запросы
    # дашборда крошечные; отсекает попытки залить большой payload).
    client_max_body_size 128k;

    # Разрешаем только осмысленные HTTP-методы; TRACE/CONNECT/прочее — 405.
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$) {
        return 405;
    }

    # ---- Безопасность: строгие HTTP-заголовки для всех ответов ----
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    # HSTS: браузер применяет ТОЛЬКО по https (по http игнорируется, поэтому
    # ставить безопасно и на localhost). За HTTPS-туннелем/доменом заставляет
    # браузер ходить только по https и не даёт «кликнуть сквозь» предупреждение TLS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Изолируем верхнеуровневый документ от окон, открытых с других источников
    # (защита от cross-window атак вроде tabnabbing / XS-Leaks).
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # CSP: разрешаем только собственный хост + Google Fonts для шрифтов, без
    # inline-скриптов/eval и без возможности встраивания в iframe.
    # Единственный разрешённый inline-скрипт (по sha256-хэшу) — это синхронный
    # выбор темы до первой отрисовки (учитывает сохранённый выбор и системную
    # тему prefers-color-scheme), чтобы избежать вспышки неверной темы.
    # worker-src/manifest-src — для service worker и manifest (PWA), оба 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-jga9pPaGgKflDdFVCOaqb1TP7su8Ncda1GCJ8UekwCM='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Проксирование API-запросов на бэкенд
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Запрет доступа к любым dot-файлам (.git/.env-подобным) — их нет в образе,
    # но это защита в глубину на случай будущих изменений сборки.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Статические JS/CSS: отдаём напрямую, без SPA-фолбэка на index.html.
    # Если файл отсутствует — честная 404, а не HTML вместо скрипта/стиля.
    # nginx не наследует add_header в location со своим add_header, поэтому
    # nosniff здесь переобъявлен (важно для скриптов/стилей — против MIME-подмены).
    location ~* \.(?:js|css|map)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # PWA-манифест: правильный MIME-тип (иначе браузер может его отклонить)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Service worker: без кэша, чтобы обновления подхватывались сразу
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Встраиваемый виджет (#39): единственный путь, где ослаблен frame-ancestors.
    # nginx НЕ наследует add_header, если в location есть хоть один — поэтому
    # здесь заголовки переобъявлены целиком, с frame-ancestors 'self' (тот же
    # домен) вместо 'none'. Чтобы разрешить встраивание на СТОРОННИХ доменах,
    # допишите их сюда явным списком, например:
    #   frame-ancestors 'self' https://partner.example.com;
    # НИКОГДА не ставьте '*' — это отдаст виджет любому сайту.
    location = /embed.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-jga9pPaGgKflDdFVCOaqb1TP7su8Ncda1GCJ8UekwCM='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # Публичная read-only страница (#38): не индексируется поисковиками.
    location = /public.html {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # SPA fallback только для страниц
    location / {
        try_files $uri $uri/ /index.html;
    }
}
