server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Скрываем версию nginx в ответах и в заголовках ошибок
    server_tokens off;

    # ---- Безопасность: строгие HTTP-заголовки для всех ответов ----
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # CSP: разрешаем только собственный хост + Google Fonts для шрифтов, без
    # inline-скриптов/eval и без возможности встраивания в iframe.
    # Единственный разрешённый inline-скрипт (по sha256-хэшу) — это
    # синхронный выбор темы до первой отрисовки, чтобы избежать вспышки неверной темы.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-k2qmmUzR35zQOO6bHUWsHZyakI0D07hjhjq1a8MkcAY='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Проксирование API-запросов на бэкенд
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Статические JS/CSS: отдаём напрямую, без SPA-фолбэка на index.html.
    # Если файл отсутствует — честная 404, а не HTML вместо скрипта/стиля.
    location ~* \.(?:js|css|map)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback только для страниц
    location / {
        try_files $uri $uri/ /index.html;
    }
}
